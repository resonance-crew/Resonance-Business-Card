<style>
  /* One card on a desk; what you can do with it underneath. */
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(110% 70% at 50% 28%, var(--page) 0%, var(--page-deep) 100%) fixed;
  }
  .share {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    max-width: 760px;
    margin: 0 auto;
  }
  /* A phone set to large text (LINE and Facebook's browsers scale the page's text with it) has no room for
     both on one line: the wordmark never breaks, and the language control drops below it, at the right. */
  .share-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; }
  .share-top .lang-toggle { margin-left: auto; }
  .share-brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--ink);
    text-decoration: none;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    line-height: 1;
    white-space: nowrap;
  }
  /* The mark is a block of its own (an inline one sat on the baseline with the line's descent
     under it, so centring that box lifted the waves ~2 px) and the line is exactly the type,
     so the flex centre is the ink centre: measured at 390 and 1280, zh and en, the waves' ink
     centre lies within 0.5 px of the wordmark's (共振's ink centroid to 0.05 px). */
  #brand-mark { display: block; flex: none; width: 26px; height: 26px; color: var(--accent); }
  #brand-mark svg { display: block; width: 100%; height: 100%; }
  .share-brand:focus-visible { border-radius: 6px; }
  /* The site's language control: the wobbly globe and the language's own name, frameless. */
  .lang-toggle {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: none;
    border-radius: 10px;
    padding: 8px 12px;
    margin-right: -12px;
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1;
    color: var(--ink);
    cursor: pointer;
  }
  .lang-toggle .o-globe { width: 17px; height: 17px; flex: none; }
  .share-main {
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 18px;
    padding-block: clamp(20px, 6vh, 64px);
    min-width: 0;
  }
  #stage { width: 100%; display: grid; place-items: center; padding-block: 8px 4px; }
  #stage .c3-stage { width: min(100%, 560px); }
  #stage[data-orientation='portrait'] .c3-stage { width: min(78%, 330px, calc((100dvh - 330px) * 0.6)); min-width: 220px; }
  .share-hint { margin: 0; font-size: 12.5px; letter-spacing: 0.12em; color: var(--ink-soft); }
  .share-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .share-actions .o-btn {
    padding: 10px 18px;
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: 0.04em;
  }
  /* The site's hand-drawn arrow, turned toward the upper right (organic.js arrowUpRightIcon); it leans out on hover. */
  #about-link .o-arrow { display: block; flex: none; width: 13px; height: 13px; transition: transform 0.2s var(--ease-out); }
  #about-link .o-arrow svg { display: block; width: 100%; height: 100%; }
  #about-link:hover .o-arrow { transform: translate(2px, -2px); }
  @media (prefers-reduced-motion: reduce) { #about-link .o-arrow { transition: none; } }
  .share-email { margin: 0; font-size: 14px; color: var(--ink-soft); user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; }
  .share-status { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--accent-ink); }
  .share-about {
    max-width: 60ch;
    width: 100%;
    margin-top: clamp(16px, 4vh, 40px);
    display: grid;
    gap: 8px;
  }
  .share-about .o-divider { margin-bottom: 12px; }
  /* Before the hand-drawn rule is drawn: a plain one where it will be. */
  .o-divider:empty { height: 1px; background: currentColor; }
  /* The footer link is 12 px: the pen's underline at INK_LIGHT, so it doesn't outweigh the letters. */
  .share-foot .o-link-line path { stroke-width: 1.2px; }
  .share-about h2 { margin: 0; font-family: var(--font-sans-zh); font-size: 15px; letter-spacing: 0.14em; font-weight: 600; color: var(--ink-soft); }
  .share-about p { margin: 0; font-family: var(--font-serif-zh); font-size: 15.5px; line-height: 1.95; letter-spacing: 0.03em; text-wrap: pretty; }
  html[lang='en'] .share-about p { font-family: var(--font-display); letter-spacing: 0; line-height: 1.7; }
  .share-foot { text-align: center; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.08em; }
  .share-foot .o-link { color: var(--ink-soft); }
</style>
